name: song-search-milvus

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./deploy/milvus/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./deploy/milvus/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v3.0.1
    command: ["milvus", "run", "standalone"]
    stop_grace_period: 60s
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ./deploy/milvus/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      - "etcd"
      - "minio"

  # Web search UI and API with hot-reloading for local development
  web:
    container_name: song-search-web
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MILVUS_URI=http://standalone:19530
      - MILVUS_COLLECTION=songs_sample
      - MILVUS_TIMEOUT=10
      - SONG_SEARCH_DEVICE=cpu
    volumes:
      - ./src:/app/src
      - ./static:/app/static
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - hf-cache:/root/.cache/huggingface
    depends_on:
      standalone:
        condition: service_healthy
    command: ["python", "-m", "uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # One-command shortcut: docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      - MILVUS_URI=http://standalone:19530
      - MILVUS_COLLECTION=songs_sample
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - hf-cache:/root/.cache/huggingface
    depends_on:
      standalone:
        condition: service_healthy
    command: ["python", "-m", "src.migrate_faiss_to_milvus", "--artifacts", "artifacts/sample", "--collection", "songs_sample"]

  # One-command shortcut: docker compose run --rm build-sample
  build-sample:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      - MILVUS_URI=http://standalone:19530
      - MILVUS_COLLECTION=songs_sample
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - hf-cache:/root/.cache/huggingface
    depends_on:
      standalone:
        condition: service_healthy
    command: ["python", "-m", "src.build_index", "--csv", "data/spotify_millsongdata.csv", "--collection", "songs_sample", "--sample-size", "1000", "--seed", "42"]

  # One-command shortcut: docker compose run --rm test
  test:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      - MILVUS_URI=http://standalone:19530
      - MILVUS_COLLECTION=songs_sample
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./static:/app/static
      - ./artifacts:/app/artifacts
      - hf-cache:/root/.cache/huggingface
    depends_on:
      standalone:
        condition: service_healthy
    command: ["pytest", "-v"]

volumes:
  hf-cache:

networks:
  default:
    name: milvus
