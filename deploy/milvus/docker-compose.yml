# Milvus Standalone v3.0.1 for local development.
#
# Based on the official release file:
#   https://github.com/milvus-io/milvus/releases/download/v3.0.1/milvus-standalone-docker-compose.yml
# Changes from the official file (nothing else):
#   - fixed compose project name `song-search-milvus`
#   - every published port is bound to 127.0.0.1 only
#   - removed the obsolete top-level `version:` key
#   - MinIO image pulled from MinIO's quay.io registry: the official file's Docker Hub reference
#     `minio/minio:RELEASE.2024-12-18T13-15-44Z` failed here with "pull access denied" (2026-09-19).
#     Same MinIO release tag, different registry.
#   - `stop_grace_period: 60s` on the Milvus service (see comment there)
#
# Data persists in bind mounts under ./volumes (next to this file) or $DOCKER_VOLUME_DIRECTORY/volumes.
# `docker compose stop` / `start` / `restart` and `docker compose down` (without -v) all keep that data.
# Pair with the Python SDK pymilvus==3.0.1 (the release notes' SDK version for Milvus v3.0.1).
name: song-search-milvus

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      # Official local-development defaults; the ports below are reachable from this machine only.
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v3.0.1
    command: ["milvus", "run", "standalone"]
    # Docker's default 10 s stop timeout killed Milvus (exit 137) during testing; allow a clean shutdown.
    stop_grace_period: 60s
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      - "etcd"
      - "minio"

networks:
  default:
    name: milvus
